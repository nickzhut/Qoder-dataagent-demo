apiVersion: dw.semantic/v1
kind: Metric
metadata:
  name: gross_profit_amt
  version: 1.0.0
  owner: data-arch
  status: draft
spec:
  display_name: 毛利额
  domain: TRD
  grain: [shop_id, business_date]
  definition: SUM(item_net_amt - item_cost_amt)
  source:
    table: dwd_trd_order_item_di
    filter: "dt = '${bizdate}' AND is_valid = 1"
  dimensions: [shop_id, city_id, region_id, category_id, sku_id]
  data_type: DECIMAL(18,6)
  synonyms: [毛利, 毛利金额]
  acceptance:
    - 毛利额可解释为销售额减商品成本
    - 与 DWD 同日汇总差异为 0
